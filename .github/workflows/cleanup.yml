name: Clean URLs After Export

on:
  push:
    branches: [ main ]  # Change to match your export branch

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Remove hardcoded IPs in files
        run: |
          echo "Cleaning IPs in HTML/CSS/JS..."
          find . -type f \( -iname "*.html" -o -iname "*.css" -o -iname "*.js" \) | while read file; do
            sed -i \
              -e 's|http://13\.61\.155\.137||g' \
              -e 's|https://13\.61\.155\.137||g' \
              -e 's|//13\.61\.155\.137||g' \
              -e 's|http:\\/\\/13\.61\.155\.137\\||g' \
              "$file"
          done

      - name: Commit and push cleaned files
        env:
          TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}
          git commit -am "Cleaned IPs from exported files"
          git push origin HEAD
