name: Clean URLs After Export

on:
  push:
    branches: [ main ]

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}  # Use the default token with proper permissions

      - name: Remove hardcoded IPs in files
        run: |
          echo "Scanning files for IP patterns..."
          # Search in all files except .git directory
          find . -type f \( -iname "*.html" -o -iname "*.css" -o -iname "*.js" \) | while read file; do
            if grep -q "13\.61\.155\.137" "$file"; then
              echo "Processing: $file"
              # Create temp file for editing
              temp_file=$(mktemp)
              # More comprehensive replacement patterns
              sed \
                -e 's|http[s]\?://13\.61\.155\.137||g' \
                -e 's|//13\.61\.155\.137||g' \
                -e 's|http[s]\?:\\/\\/13\.61\.155\.137||g' \
                -e 's|\\/\\/13\.61\.155\.137||g' \
                -e 's|13\.61\.155\.137||g' \
                "$file" > "$temp_file"
              # Only overwrite if changes were made
              if ! cmp --silent "$file" "$temp_file"; then
                mv "$temp_file" "$file"
              else
                rm "$temp_file"
              fi
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "::set-output name=has_changes::false"
            echo "No changes detected"
          else
            echo "::set-output name=has_changes::true"
            echo "Changes detected"
          fi

      - name: Commit and push cleaned files
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Removed hardcoded IPs"
          git push
