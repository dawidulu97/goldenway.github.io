name: Clean URLs After Export

on:
  push:
    branches: [ main ]  # Change to your export branch if needed

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Remove hardcoded IPs in files
        run: |
          echo "Scanning files for IP patterns..."
          find . -type f \( -iname "*.html" -o -iname "*.css" -o -iname "*.js" \) | while read file; do
            echo "Processing: $file"
            sed -i \
              -e 's|http://13\.61\.155\.137||g' \
              -e 's|https://13\.61\.155\.137||g' \
              -e 's|//13\.61\.155\.137||g' \
              -e 's|http:\\/\\/13\.61\.155\.137||g' \
              -e 's|https:\\/\\/13\.61\.155\.137||g' \
              -e 's|\\/\\/13\.61\.155\.137||g' \
              "$file"
          done

   - name: Commit and push cleaned files
  env:
    GH_TOKEN: ${{ secrets.GH_TOKEN }}
  run: |
    git config user.name "github-actions"
    git config user.email "actions@github.com"
    git remote set-url origin https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}
    git commit -am "Removed hardcoded IPs" || echo "No changes"
    git push origin HEAD
