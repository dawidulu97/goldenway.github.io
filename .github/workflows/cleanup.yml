name: Clean URLs After Export

on:
  push:
    branches: [ main ]  # or your export branch

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Remove hardcoded IPs
        run: |
          find . -type f -name "*.html" -o -name "*.css" -o -name "*.js" | while read file; do
            sed -i 's|http://13\.61\.155\.137/||g' "$file"
          done

     - name: Commit and push changes
  env:
    TOKEN: ${{ secrets.GH_TOKEN }}
  run: |
    git config user.name "github-actions"
    git config user.email "actions@github.com"
    git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}
    git commit -am "Cleaned up IP URLs"
    git push origin HEAD
